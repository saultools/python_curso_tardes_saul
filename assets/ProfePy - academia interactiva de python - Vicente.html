<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profe Py - Academia interactiva de Python</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
:root{--bg:#0e0f12;--panel:#16181d;--panel2:#1d2027;--line:#2c3039;--tx:#ecebe6;--mut:#a3a3ad;--ac:#ff7a1a;--ac-t:#ffa35c;--ok:#4ade80;--ko:#f87171;--r:0px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:'Space Grotesk',system-ui,sans-serif;line-height:1.55;font-size:16px;min-height:100vh;padding-bottom:150px}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:1px solid var(--line);padding:.55rem .9rem;border-radius:var(--r);transition:background .15s,border-color .15s,color .15s}
button:hover{border-color:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input[type=text],input[type=number]{background:var(--bg);border:1px solid var(--line);padding:.55rem .7rem;border-radius:var(--r);width:100%}
input:focus{border-color:var(--ac)}
code,pre,.mono{font-family:'JetBrains Mono',monospace}
.btn{background:var(--ac);color:#0e0f12;border-color:var(--ac);font-weight:700}
.btn:hover{background:var(--ac-t);border-color:var(--ac-t)}
.lbl{font-family:'JetBrains Mono',monospace;font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;color:var(--mut)}
.ac{color:var(--ac-t)}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1.2rem;padding:.6rem 1.2rem}
.logo{font-weight:700;font-size:1.25rem;letter-spacing:-.02em;display:flex;align-items:center;gap:.5rem}
.logo i{color:var(--ac)}
.seg{display:inline-flex;border:1px solid var(--line);flex-wrap:wrap}
.seg button{border:0;border-right:1px solid var(--line);padding:.45rem .85rem;font-size:.9rem}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--tx);color:var(--bg);font-weight:600}
.seg button:hover{background:var(--panel2)}
.seg button.on:hover{background:var(--tx)}
.xp{margin-left:auto;display:flex;align-items:center;gap:.7rem;font-size:.85rem}
.xpbar{width:110px;height:6px;background:var(--line)}
.xpbar div{height:100%;background:var(--ac);transition:width .4s}
main{max-width:1180px;margin:0 auto;padding:1.5rem 1.2rem}
h1{font-size:clamp(2.6rem,7vw,5.2rem);line-height:1;letter-spacing:-.04em;text-wrap:balance}
h2{font-size:clamp(1.5rem,3vw,2.1rem);letter-spacing:-.02em;margin-bottom:.4rem;text-wrap:balance}
h3{font-size:1.1rem;margin:1.2rem 0 .4rem}
p{max-width:68ch;text-wrap:pretty}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:2.5rem;align-items:center;padding:2rem 0 2.5rem;border-bottom:1px solid var(--line)}
.hero p.lead{font-size:1.2rem;color:var(--mut);margin-top:1.2rem}
.hero .cta{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:1.6rem}
.fig{border:1px solid var(--line);background:var(--panel);padding:1rem}
.fig figcaption{margin-top:.6rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
.stats div{padding:1.2rem 1rem;border-right:1px solid var(--line)}
.stats div:last-child{border-right:0}
.stats b{display:block;font-size:2rem;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.levels{display:grid}
.levels .row{display:grid;grid-template-columns:90px 1fr auto;gap:1rem;align-items:center;padding:1.2rem 0;border-bottom:1px solid var(--line)}
.levels .row .n{font-size:2.6rem;font-weight:700;color:var(--ac-t);letter-spacing:-.04em}
.sec{padding:2rem 0}
.dot{display:inline-block;width:.6rem;height:.6rem;background:var(--ac);border-radius:50%;margin-right:.5rem}
.layout{display:grid;grid-template-columns:270px 1fr;gap:2rem;align-items:start}
.side{position:sticky;top:4.2rem;border:1px solid var(--line);max-height:calc(100vh - 6rem);overflow:auto}
.side button{display:flex;gap:.7rem;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);padding:.7rem .9rem}
.side button.on{background:var(--ac);color:#0e0f12;font-weight:700}
.side button i.s{margin-left:auto;font-size:.8rem}
.side button .lv{font-size:.65rem}
.tag{font-family:'JetBrains Mono',monospace;font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;border:1px solid var(--line);padding:.1rem .4rem;color:var(--mut)}
.lesson ul{list-style:none;margin:.8rem 0}
.lesson li{padding:.45rem 0 .45rem 1.4rem;position:relative;border-bottom:1px solid var(--line);max-width:72ch}
.lesson li:before{content:"";position:absolute;left:0;top:.95rem;width:.55rem;height:.55rem;background:var(--ac);border-radius:50%}
pre.code{background:#0a0b0d;border:1px solid var(--line);border-left:3px solid var(--ac);padding:1rem;overflow:auto;font-size:.88rem;line-height:1.6;margin:.8rem 0;white-space:pre}
.k{color:#ff9f5a;font-weight:500}.s{color:#7fd6a0}.c{color:#7d8290;font-style:italic}.nn{color:#7cc4ff}
.why{border:1px solid var(--ac);padding:1rem 1.1rem;margin:1.2rem 0;background:var(--panel)}
.why .lbl{color:var(--ac-t);display:block;margin-bottom:.3rem}
.note{border-left:3px solid var(--mut);padding:.6rem 1rem;color:var(--mut);margin:1rem 0;font-size:.92rem;max-width:72ch}
.panel{border:1px solid var(--line);background:var(--panel);padding:1.1rem;margin:1.2rem 0}
.panel>.lbl{display:block;margin-bottom:.7rem;color:var(--ac-t)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
.cells{display:flex;gap:0;flex-wrap:wrap}
.cell{min-width:56px;text-align:center;border:1px solid var(--line);margin-right:-1px;padding:.2rem .3rem;font-family:'JetBrains Mono',monospace;transition:background .2s}
.cell small{display:block;font-size:.7rem;color:var(--mut)}
.cell.hi{background:var(--ac);color:#0e0f12}.cell.hi small{color:#0e0f12}
.cell b{display:block;font-size:1.1rem;padding:.3rem 0}
.out{background:#0a0b0d;border:1px solid var(--line);padding:.7rem 1rem;font-family:'JetBrains Mono',monospace;font-size:.9rem;min-height:2.6rem;white-space:pre-wrap}
.out .e{color:var(--ko)}.out .g{color:var(--ok)}
.tracecode{background:#0a0b0d;border:1px solid var(--line);font-family:'JetBrains Mono',monospace;font-size:.9rem}
.tracecode div{padding:.15rem .8rem;white-space:pre;border-left:3px solid transparent}
.tracecode div.cur{background:#2a1a0c;border-left-color:var(--ac)}
.tracecode i{display:inline-block;width:1.6rem;color:#6b7080;font-style:normal}
.vbox{display:inline-block;border:1px solid var(--line);margin:0 .5rem .5rem 0;min-width:84px;text-align:center}
.vbox span{display:block;font-family:'JetBrains Mono',monospace;font-size:.75rem;background:var(--panel2);padding:.1rem .4rem;color:var(--mut)}
.vbox b{display:block;padding:.45rem .6rem;font-family:'JetBrains Mono',monospace;transition:background .25s}
.vbox.ch b{background:var(--ac);color:#0e0f12}
table{border-collapse:collapse;width:100%;font-family:'JetBrains Mono',monospace;font-size:.85rem}
th,td{border:1px solid var(--line);padding:.35rem .6rem;text-align:left}
th{background:var(--panel2);color:var(--ac-t);font-weight:500}
td.hi{background:var(--ac);color:#0e0f12}
.tree{font-family:'JetBrains Mono',monospace;font-size:.85rem}
.node{border:1px solid var(--line);margin:.3rem 0;background:var(--bg)}
.node>.hd{display:flex;gap:.6rem;align-items:center;padding:.25rem .6rem;background:var(--panel2);cursor:pointer;font-size:.75rem;color:var(--mut)}
.node>.hd:hover{background:#262a33}
.node>.hd.sel,.leaf.sel{outline:2px solid var(--ac)}
.item{display:flex;gap:.6rem;align-items:flex-start;padding:.2rem .6rem}
.item>.ix{min-width:3.4rem;color:var(--ac-t);padding-top:.3rem}
.leaf{display:inline-block;padding:.25rem .6rem;border:1px solid var(--line);cursor:pointer;background:var(--panel)}
.leaf:hover{border-color:var(--ac)}
.leaf.ok{background:var(--ac);color:#0e0f12}
.q{border:1px solid var(--line);padding:1.1rem;margin:1rem 0;background:var(--panel)}
.q .qt{font-weight:600;margin-bottom:.4rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:.8rem}
.opts button{text-align:left;font-family:'JetBrains Mono',monospace;font-size:.88rem;padding:.6rem .8rem}
.opts button.good,.good{border-color:var(--ok);background:#12301f}
.opts button.bad{border-color:var(--ko);background:#34161a}
.fb{margin-top:.8rem;padding:.7rem 1rem;border-left:3px solid var(--mut);background:var(--panel2);font-size:.95rem}
.fb.g{border-color:var(--ok)}.fb.b{border-color:var(--ko)}
.prog{height:6px;background:var(--line);margin:.6rem 0 1rem}.prog div{height:100%;background:var(--ac);transition:width .3s}
.gamegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:0;border:1px solid var(--line)}
.gamegrid>button{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:1.3rem;text-align:left;display:flex;gap:1rem;align-items:flex-start}
.gamegrid>button i{font-size:1.7rem;color:var(--ac-t);margin-top:.2rem}
.gamegrid>button:hover{background:var(--panel2)}
.gamegrid b{display:block;font-size:1.1rem}.gamegrid span{color:var(--mut);font-size:.9rem}
.bar{height:8px;background:var(--line);margin:.6rem 0}.bar div{height:100%;background:var(--ac);width:100%}
.pz{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.ln{font-family:'JetBrains Mono',monospace;font-size:.88rem;border:1px solid var(--line);padding:.4rem .7rem;margin-bottom:.35rem;cursor:pointer;background:var(--bg);white-space:pre}
.ln:hover{border-color:var(--ac)}
.zone{border:1px dashed var(--line);padding:.6rem;min-height:120px}
.bugline{display:block;width:100%;text-align:left;font-family:'JetBrains Mono',monospace;font-size:.9rem;border:1px solid transparent;border-bottom:1px solid var(--line);white-space:pre;padding:.4rem .7rem}
.bigq{font-family:'JetBrains Mono',monospace;font-size:clamp(1.6rem,5vw,2.8rem);font-weight:700;letter-spacing:-.02em;margin:.6rem 0 1rem}
/* teacher */
#teacher{position:fixed;left:14px;bottom:14px;z-index:30;display:flex;gap:.6rem;align-items:flex-end;max-width:min(520px,calc(100vw - 28px))}
#teacher svg{flex:none;width:84px;height:94px}
#bubble{background:var(--tx);color:#0e0f12;padding:.7rem .9rem;font-size:.9rem;line-height:1.4;position:relative;max-height:130px;overflow:auto;font-weight:500}
#bubble:before{content:"";position:absolute;left:-8px;bottom:18px;border:8px solid transparent;border-left:0;border-right-color:var(--tx)}
#teacher .x{position:absolute;right:-6px;top:-10px;width:22px;height:22px;padding:0;font-size:.7rem;background:var(--bg)}
.toast{position:fixed;right:14px;bottom:14px;background:var(--ac);color:#0e0f12;padding:.7rem 1rem;font-weight:700;z-index:40}
.hidden{display:none!important}
.fade{animation:in .3s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(max-width:860px){
 .hero,.layout,.row2,.pz,.gamegrid{grid-template-columns:1fr}
 .side{position:static;max-height:260px}
 .stats{grid-template-columns:1fr 1fr}.stats div{border-bottom:1px solid var(--line)}
 .levels .row{grid-template-columns:60px 1fr}.levels .row button{grid-column:1/-1}
 .opts{grid-template-columns:1fr}.grid3{grid-template-columns:1fr 1fr}
 .xp{margin-left:0;width:100%}
 #bubble{font-size:.8rem;max-height:90px}#teacher svg{width:56px;height:64px}
 body{padding-bottom:130px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top">
  <div class="logo"><i class="fa-solid fa-terminal"></i> Profe Py</div>
  <nav class="seg" id="nav"></nav>
  <div class="seg" id="lvlseg" title="Tu nivel"></div>
  <div class="xp"><span class="lbl" id="rank">Aprendiz</span><div class="xpbar"><div id="xpf" style="width:0"></div></div><span class="mono" id="xpn">0 XP</span></div>
</header>
<main id="view"></main>

<div id="teacher">
  <svg id="face" viewBox="0 0 84 94" aria-hidden="true">
    <rect x="22" y="2" width="40" height="8" fill="#ff7a1a"/><rect x="38" y="10" width="8" height="8" fill="#ecebe6"/>
    <rect x="8" y="18" width="68" height="56" fill="#ecebe6"/>
    <rect x="16" y="28" width="22" height="18" fill="#0e0f12"/><rect x="46" y="28" width="22" height="18" fill="#0e0f12"/>
    <rect x="22" y="34" width="8" height="8" fill="#ff7a1a" id="eyeL"/><rect x="52" y="34" width="8" height="8" fill="#ff7a1a" id="eyeR"/>
    <rect x="38" y="35" width="8" height="4" fill="#0e0f12"/>
    <path id="mouth" d="M28 58 Q42 68 56 58" stroke="#0e0f12" stroke-width="4" fill="none"/>
    <rect x="18" y="76" width="48" height="16" fill="#ff7a1a"/><text x="42" y="89" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="11" font-weight="700" fill="#0e0f12"></></text>
  </svg>
  <div id="bubble" aria-live="polite"></div>
</div>

<script>
/* ===================== UTILIDADES ===================== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>');
const rnd=n=>Math.floor(Math.random()*n), pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const KW='def|return|if|elif|else|for|while|in|import|from|as|lambda|match|case|try|except|break|continue|and|or|not|with|True|False|None|is';
const hlRe=new RegExp('(#.*$)|("[^"\\n]*"|\'[^\'\\n]*\')|\\b('+KW+')\\b|\\b(\\d+(?:\\.\\d+)?)\\b','gm');
const hl=s=>esc(s).replace(hlRe,(m,c,st,k,n)=>c?`<span class="c">${c}</span>`:st?`<span class="s">${st}</span>`:k?`<span class="k">${k}</span>`:`<span class="nn">${n}</span>`);
const code=s=>`<pre class="code">${hl(s)}</pre>`;
const LV={b:'Básico',i:'Intermedio',p:'Profesional'};
let S={xp:0,level:'b',tab:'inicio',done:{},best:{}};
try{const x=JSON.parse(localStorage.getItem('profepy')||'null');if(x)S=Object.assign(S,x)}catch(e){}
const save=()=>{try{localStorage.setItem('profepy',JSON.stringify(S))}catch(e){}};
const RANKS=[[0,'Aprendiz'],[120,'Programador'],[350,'Pythonista'],[700,'Maestro del código'],[1200,'Gran Maestro']];
function rankOf(x){let r=RANKS[0];for(const k of RANKS)if(x>=k[0])r=k;const nx=RANKS.find(k=>k[0]>x);return{name:r[1],pct:nx?(x-r[0])/(nx[0]-r[0])*100:100}}
function addXP(n){S.xp+=n;save();paintXP();toast('+'+n+' XP')}
function paintXP(){const r=rankOf(S.xp);$('#rank').textContent=r.name;$('#xpf').style.width=r.pct+'%';$('#xpn').textContent=S.xp+' XP'}
function toast(t){const d=document.createElement('div');d.className='toast fade';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1600)}
/* profesor */
const MOUTH={happy:'M28 58 Q42 70 56 58',sad:'M28 64 Q42 54 56 64',think:'M30 62 L54 62',wow:'M34 58 Q42 72 50 58 Z'};
let typeT;
function say(msg,mood='happy'){
  $('#mouth').setAttribute('d',MOUTH[mood]||MOUTH.happy);
  $('#mouth').setAttribute('fill',mood==='wow'?'#0e0f12':'none');
  const b=$('#bubble');clearTimeout(typeT);
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){b.textContent=msg;return}
  let i=0;b.textContent='';(function t(){b.textContent=msg.slice(0,++i);if(i<msg.length)typeT=setTimeout(t,14)})();
}
const PRAISE=['¡Exacto!','¡Muy bien!','¡Eso es pensar como Python!','¡Correcto!','¡Así se hace!'];
const OOPS=['Casi. Mira la explicación.','No pasa nada, así se aprende.','Fíjate bien en cada línea.','Python no perdona, pero tú aprendes rápido.'];

/* ===================== LECCIONES ===================== */
const LESSONS=[
{id:1,l:'b',t:'Variables y tipos de datos',ic:'cube',w:'ident',
 pts:['Un <b>dato</b> es información que maneja el programa. Tipos básicos: <b>int</b> (10, -15), <b>float</b> (7.2), <b>bool</b> (True/False) y <b>str</b> ("texto").',
 'Una <b>variable</b> es una caja con nombre. El signo <code>=</code> asigna <b>de derecha a izquierda</b>: primero se calcula la derecha, luego se guarda.',
 'Identificadores: no pueden empezar por número, no admiten signos de puntuación y no pueden ser palabras reservadas (<code>for</code>, <code>if</code>...).',
 'Asignación múltiple: <code>a, b, c = 1, "hola", True</code>. Y <code>print()</code> escribe, <code>input()</code> lee... pero siempre devuelve <b>texto</b>.'],
 code:`num = 100             # int
precio = 7.2          # float
activo = True         # bool
nombre = "Ana"        # str
a, b, c = 1, "hola", True

n = input("Número 1: ")   # escribes 3
x = input("Número 2: ")   # escribes 4
print(n + x)              # 34  (concatena textos)
print(int(n) + int(x))    # 7   (suma números)
print(f"El número es {num}")`,
 why:'Python guarda cada dato con su tipo y el operador <code>+</code> se comporta según ese tipo: suma números pero une textos. Por eso <code>"3"+"4"</code> da <code>"34"</code>. Entender el tipo es entender qué hará cada operación.'},
{id:2,l:'b',t:'Operadores',ic:'plus-minus',w:'ops',
 pts:['<b>Aritméticos</b>: <code>+ - * / // % **</code>. <code>//</code> divide redondeando hacia abajo; <code>%</code> da el resto; <code>**</code> es potencia.',
 '<b>Asignación</b>: <code>=</code> y los compuestos <code>+= -= *= /= %= //= **=</code>. <code>x += 5</code> equivale a <code>x = x + 5</code>.',
 '<b>Relacionales</b> (<code>== != < > <= >=</code>) devuelven True o False. <b>Lógicos</b>: <code>and</code>, <code>or</code>, <code>not</code>.',
 'Otros: <code>in</code> (¿está dentro?), <code>is</code> (¿mismo objeto?) y el <b>ternario</b>: <code>"positivo" if a>0 else "negativo"</code>.'],
 code:`print(5 // 2)    # 2
print(5 % 2)     # 1
print(2 ** 3)    # 8
a = 5; b = 7
print((a < b) and (b == 0))   # False
print((a < b) or (b == 0))    # True
print(not (a < b))            # False
dato = "positivo" if a > 0 else "negativo"`,
 why:'Los operadores relacionales convierten datos en decisiones (True/False) y los lógicos las combinan. Todo <code>if</code> y todo <code>while</code> se alimenta de estas expresiones. <code>and</code> exige que ambas sean True; <code>or</code> con que una lo sea basta.'},
{id:3,l:'b',t:'Condicionales: if, elif, match',ic:'code-branch',w:'trace0',
 pts:['<code>if condicion:</code> ejecuta su bloque si la condición es True; <code>else</code> es opcional.',
 'Se considera falso: <code>False</code>, <code>0</code>, <code>""</code> (texto vacío), listas vacías y <code>None</code>. Lo demás es verdadero.',
 'Con varias condiciones excluyentes: <code>if / elif / elif / else</code>. Se evalúan <b>en orden</b> y solo entra el primer bloque verdadero.',
 '<code>match</code> (Python 3.10+) elige según un valor; <code>_</code> es el caso por defecto y <code>|</code> junta valores. Admite guardas con <code>if</code>.',
 'La <b>indentación</b> (tabulado) define qué pertenece a cada bloque.'],
 code:`n = 5; a = 7
if n > a:
    print("El mayor es", n)
else:
    print("El mayor es", a)

day = 4
match day:
    case 1 | 2 | 3 | 4 | 5:
        print("Hoy es día de diario")
    case 6 | 7:
        print("Es fin de semana")
    case _:
        print("Día inválido")`,
 why:'El <code>elif</code> se detiene en el primer True: si pones primero <code>nota >= 5</code>, un 9 nunca llegaría al bloque de "Sobresaliente". El orden de las condiciones es parte de la lógica.'},
{id:4,l:'b',t:'Bucles: for, while, break, continue',ic:'rotate',w:'trace1',
 pts:['<code>for var in conjunto:</code> recorre listas, tuplas, textos o <code>range()</code>. <code>range(1,10)</code> va del 1 al <b>9</b> (el último no entra).',
 '<code>while condicion:</code> repite <b>mientras</b> la condición sea True. Si nunca cambia, el bucle es infinito.',
 '<code>break</code> sale del bucle definitivamente. <code>continue</code> salta a la siguiente vuelta.',

{id:5,l:'i',t:'Listas',ic:'list-ol',w:'slice',

{id:6,l:'i',t:'Tuplas y conjuntos',ic:'lock',w:null,

{id:9,l:'i',t:'Funciones, lambdas, map, filter, reduce',ic:'gears',w:null,
 pts:['<code>def nombre(p1, p2):</code> crea una función; <code>return</code> devuelve el resultado. <b>Sin return devuelve None</b>.',
 'Argumentos por defecto: <code>def f(x, y=100)</code>. Número variable: <code>def f(*args)</code> (llegan como tupla, siempre al final).',
 '<code>lambda n: n**2</code> es una función corta sin nombre ni return.',
 '<b>map</b> transforma cada elemento, <b>filter</b> se queda con los que cumplen una condición, <b>reduce</b> combina todos en un solo valor.'],
 code:`def media(a, b=10):
    return (a + b) / 2
print(media(4), media(4, 6))      # 7.0 5.0

def total(*args):
    return sum(args)
print(total(2, 6, 8))             # 16

numeros = [1, 2, 3, 4, 5]
print(list(map(lambda x: x**2, numeros)))        # [1, 4, 9, 16, 25]
print(list(filter(lambda x: x % 2 == 0, numeros)))# [2, 4]
from functools import reduce
print(reduce(lambda a, b: a + b, numeros))        # 15`,
 why:'Una función evita repetir código y le pone nombre a una idea. <code>map/filter/reduce</code> son los tres verbos de los datos: <i>transformar, seleccionar, resumir</i>. Combinados con diccionarios (<code>sorted(lista, key=lambda p: p["edad"])</code>) resuelven en una línea lo que un bucle haría en seis.'},

 pts:['<code>open(ruta, modo)</code>: <code>"r"</code> leer, <code>"w"</code> escribir <b>sobrescribiendo</b>, <code>"a"</code> añadir. Usa <code>encoding="UTF-8"</code> con tildes. <code>with open(...)</code> cierra solo.',

/* ===================== MOTOR QUIZ ===================== */
let QZ=null;
function startQuiz(filter,n,title,back){
  const pool=shuffle(Q.filter(filter)).slice(0,n);
  if(!pool.length){say('Aún no hay preguntas para eso.','think');return}
  QZ={pool,i:0,ok:0,title,back,done:false,ans:false};
  drawQuiz();
}
function drawQuiz(){
  const el=$('#qzbox');if(!el)return;
  if(!QZ){el.innerHTML='';return}
  if(QZ.i>=QZ.pool.length){
    const p=Math.round(QZ.ok/QZ.pool.length*100);
    const xp=QZ.ok*10+(p===100?30:0);
    if(!QZ.done){QZ.done=true;addXP(xp);const k=QZ.title;S.best[k]=Math.max(S.best[k]||0,p);save()}
    say(p===100?'¡Perfecto! Eso es dominar el código.':p>=60?'Buen resultado. Repasa lo que fallaste.':'Hay que repasar, pero ya sabes dónde mirar.',p>=60?'wow':'think');
    el.innerHTML=`<div class="q fade"><span class="lbl">${esc(QZ.title)}</span><h2 style="margin-top:.4rem">${QZ.ok} / ${QZ.pool.length} correctas (${p}%)</h2><p>Has ganado ${xp} XP. ${p===100?'Bonus de 30 XP por no fallar ninguna.':''}</p><div style="display:flex;gap:.6rem;margin-top:1rem;flex-wrap:wrap"><button class="btn" onclick="drawQuiz2()">Repetir</button><button onclick="QZ=null;drawQuiz()">Cerrar</button></div></div>`;
    return;
  }
  const q=QZ.pool[QZ.i],typed=!q[4];
  el.innerHTML=`<div class="q fade"><span class="lbl">${esc(QZ.title)} · pregunta ${QZ.i+1}/${QZ.pool.length} · ${LV[q[1]]}</span>
  <div class="prog"><div style="width:${QZ.i/QZ.pool.length*100}%"></div></div>
  <div class="qt">${esc(q[2])}</div>${q[3]?code(q[3]):''}
  ${typed?`<div style="display:flex;gap:.5rem;margin-top:.6rem"><input type="text" id="qin" placeholder="Tu respuesta..." autocomplete="off"><button class="btn" id="qgo">Comprobar</button></div>`:
  `<div class="opts">${q[4].map((o,k)=>`<button data-k="${k}">${esc(o)}</button>`).join('')}</div>`}
  <div id="qfb"></div></div>`;
  if(typed){const go=()=>answerQ($('#qin').value);$('#qgo').onclick=go;$('#qin').onkeydown=e=>{if(e.key==='Enter')go()};$('#qin').focus()}
  else $$('.opts button',el).forEach(b=>b.onclick=()=>answerQ(+b.dataset.k));
  QZ.ans=false;
}
function drawQuiz2(){const f=QZ.f;startQuiz(QZ.filter,QZ.pool.length,QZ.title)}
function answerQ(v){
  if(QZ.ans)return;const q=QZ.pool[QZ.i],typed=!q[4];let ok;
  if(typed){if(!String(v).trim())return;ok=q[5].some(a=>a.replace(/\s+/g,' ')===String(v).trim().replace(/\s+/g,' '))}
  else ok=v===q[5];
  QZ.ans=true;if(ok)QZ.ok++;
  if(!typed)$$('#qzbox .opts button').forEach((b,k)=>{b.disabled=true;if(k===q[5])b.classList.add('good');else if(k===v)b.classList.add('bad')});
  else $('#qin').disabled=true;
  say(ok?pick(PRAISE):pick(OOPS),ok?'happy':'sad');
  $('#qfb').innerHTML=`<div class="fb ${ok?'g':'b'}"><b>${ok?'Correcto.':'No exactamente.'}</b> ${typed&&!ok?'Respuesta: <code>'+esc(q[5][0])+'</code>. ':''}${esc(q[6])}</div><button class="btn" style="margin-top:.8rem" id="qnext">${QZ.i+1<QZ.pool.length?'Siguiente':'Ver resultado'} <i class="fa-solid fa-arrow-right"></i></button>`;
  $('#qnext').onclick=()=>{QZ.i++;drawQuiz()};$('#qnext').focus();
}
startQuiz.prototype=null;
// guarda el filtro para poder repetir
const _sq=startQuiz;startQuiz=function(f,n,t,b){_sq(f,n,t,b);if(QZ)QZ.filter=f};

const W={};
/* --- identificadores --- */
const RESERVED='False None True and as assert break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield match case'.split(' ');
W.ident=el=>{
  el.innerHTML=`<div class="row2"><div><label class="lbl">Nombre de variable</label><input type="text" id="wi1" value="_n20"></div><div><label class="lbl">Valor</label><input type="text" id="wi2" value="100"></div></div><div id="wio" style="margin-top:1rem"></div>`;
  const run=()=>{
    const n=$('#wi1').value.trim(),v=$('#wi2').value.trim();let nm,nt=true;
    if(!n){nm='Escribe un nombre.';nt=false}
    else if(/^\d/.test(n)){nm='No válido: no puede empezar por número.';nt=false}
    else if(!/^[A-Za-z0-9_áéíóúñÁÉÍÓÚÑ]+$/.test(n)){nm='No válido: contiene signos de puntuación o espacios.';nt=false}
    else if(RESERVED.includes(n)){nm='No válido: es una palabra reservada de Python.';nt=false}
    else nm='Válido.';
    let ty,val=v;
    if(/^-?\d+$/.test(v))ty='int';else if(/^-?\d*\.\d+$/.test(v))ty='float';else if(v==='True'||v==='False')ty='bool';
    else if(/^("[^"]*"|'[^']*')$/.test(v)){ty='str';val=v.slice(1,-1)}else ty=null;
    $('#wio').innerHTML=`<p class="${nt?'ac':''}"><i class="fa-solid fa-${nt?'check':'xmark'}"></i> Identificador: ${nm}</p>`+
    (ty?`<p><i class="fa-solid fa-check"></i> Tipo detectado: <b class="mono">${ty}</b></p><div style="margin:.8rem 0"><div class="vbox ${nt?'ch':''}"><span>${esc(n||'?')}</span><b>${esc(val)}</b></div> <span class="mono">${esc(n)} = ${esc(v)}</span></div>`:
    `<p><i class="fa-solid fa-xmark"></i> <span class="mono">${esc(v||'(vacío)')}</span> no es un literal válido: los textos van entre comillas ("hola"); sin comillas Python buscaría una variable con ese nombre (NameError).</p>`);
  };
  $$('input',el).forEach(i=>i.oninput=run);run();
};
/* --- operadores --- */
W.ops=el=>{
  el.innerHTML=`<div class="row2"><div><label class="lbl">x</label><input type="number" id="ox" value="17"></div><div><label class="lbl">y</label><input type="number" id="oy" value="5"></div></div><div class="row2" style="margin-top:1rem"><div><table id="oa"></table></div><div><table id="orr"></table></div></div>`;
  const run=()=>{
    const x=parseInt($('#ox').value)||0,y=parseInt($('#oy').value)||0;
    const fl=r=>Number.isInteger(r)?r+'.0':String(r);
    const ar=[['x + y',x+y],['x - y',x-y],['x * y',x*y],['x / y',y?fl(x/y):'ZeroDivisionError'],['x // y',y?Math.floor(x/y):'ZeroDivisionError'],['x % y',y?((x%y)+y)%y:'ZeroDivisionError'],['x ** y',y>=0?Math.pow(x,y):fl(Math.pow(x,y))]];
    const re=[['x == y',x==y],['x != y',x!=y],['x < y',x<y],['x > y',x>y],['x <= y',x<=y],['x >= y',x>=y],['(x > y) and (y > 0)',x>y&&y>0],['(x > y) or (y > 20)',x>y||y>20],['not (x > y)',!(x>y)]];
    const P=v=>typeof v==='boolean'?(v?'True':'False'):v;
    $('#oa').innerHTML='<tr><th>Aritméticos</th><th>Resultado</th></tr>'+ar.map(r=>`<tr><td>${r[0]}</td><td>${P(r[1])}</td></tr>`).join('');
    $('#orr').innerHTML='<tr><th>Relacionales y lógicos</th><th>Resultado</th></tr>'+re.map(r=>`<tr><td>${r[0]}</td><td>${P(r[1])}</td></tr>`).join('');
  };
  $$('input',el).forEach(i=>i.oninput=run);run();
};

  return out;
}

/* --- numpy --- */
W.np=el=>{
  const A=[[3,2,7],[9,4,1]];let th=5,fn='filtro';
  const run=()=>{
    const hit=[];A.forEach(r=>r.forEach(v=>{if(v>th)hit.push(v)}));
    let out,c;
    if(fn==='filtro'){c=`a1[a1 > ${th}]`;out='['+hit.join(' ')+']'}
    else if(fn==='sort'){c='np.sort(a1)';out='[[2 3 7]\n [1 4 9]]'}
    else if(fn==='max'){c='np.amax(a1)  # y np.amin(a1) = 1';out='9'}
    else if(fn==='avg'){c='np.average(a1)';out=String(+((3+2+7+9+4+1)/6).toFixed(4))}
    else{c='np.unique(a1)';out='[1 2 3 4 7 9]'}
    el.innerHTML=`<p class="mono">a1 = np.array([[3, 2, 7], [9, 4, 1]])</p>
    <table style="width:auto;margin:.8rem 0">${A.map(r=>`<tr>${r.map(v=>`<td class="${fn==='filtro'&&v>th?'hi':''}" style="width:60px;text-align:center;font-size:1.2rem">${v}</td>`).join('')}</tr>`).join('')}</table>
    <div class="seg" style="margin-bottom:1rem">${[['filtro','Filtrar'],['sort','sort'],['max','amax/amin'],['avg','average'],['uni','unique']].map(([k,t])=>`<button data-f="${k}" class="${k===fn?'on':''}">${t}</button>`).join('')}</div>
    ${fn==='filtro'?`<label class="lbl">umbral: <b class="ac mono">${th}</b></label><input type="range" min="0" max="10" value="${th}" id="nth" style="width:100%;accent-color:#ff7a1a">`:''}
    <pre class="code">${hl('>>> print('+c+')')}</pre><div class="out g">${esc(out)}</div>
    <div class="fb" style="margin-top:1rem">${fn==='filtro'?'La condición crea una "máscara" de True/False del mismo tamaño que el array; solo los elementos con True (marcados) sobreviven, y se devuelven como array de 1 dimensión, leyendo por filas.':'NumPy opera sobre todos los elementos a la vez, sin escribir bucles.'}</div>`;
    $$('[data-f]',el).forEach(b=>b.onclick=()=>{fn=b.dataset.f;run()});
    const r=$('#nth',el);if(r){r.oninput=()=>{th=+r.value;run();$('#nth',el).focus()}}
  };run();
};

/* duelo */
function genDuel(){
  const t=rnd(3);let q,ans,opts;
  if(t===0){
    const op=pick(['//','%','**','+','-','*']),a=2+rnd(9),b=op==='**'?1+rnd(3):1+rnd(5);
    const r=op==='//'?Math.floor(a/b):op==='%'?a%b:op==='**'?Math.pow(a,b):op==='+'?a+b:op==='-'?a-b:a*b;
    q=`${a} ${op} ${b}`;ans=String(r);
    const s=new Set([r]);[r+1,r-1,r+2,r*2,r+3].forEach(x=>{if(s.size<4&&!s.has(x))s.add(x)});opts=shuffle([...s].map(String));
  }else if(t===1){
    const a=1+rnd(9),b=1+rnd(9),op=pick(['==','!=','<','>','<=','>=']);
    const r={'==':a==b,'!=':a!=b,'<':a<b,'>':a>b,'<=':a<=b,'>=':a>=b}[op];
    q=`${a} ${op} ${b}`;ans=r?'True':'False';opts=['True','False'];
  }else{
    const a=1+rnd(9),b=1+rnd(9),c=1+rnd(9),d=1+rnd(9),lg=pick(['and','or']),neg=rnd(2);
    let x=a>b,y=c==d,r=lg==='and'?(x&&y):(x||y);
    q=`(${a} > ${b}) ${lg} (${c} == ${d})`;if(neg){q='not ('+q+')';r=!r}
    ans=r?'True':'False';opts=['True','False'];
  }
  return{q,ans,opts};
}
G.duel=()=>{
  let n=0,score=0,streak=0,cur,tm;
  const box=$('#game');
  const next=()=>{
    if(n>=10){clearTimeout(tm);addXP(Math.round(score/5));box.innerHTML=`<div class="q"><span class="lbl">Duelo terminado</span><h2>${score} puntos</h2><p>Mejor racha: ${S.maxStreak||0}</p><button class="btn" onclick="G.duel()" style="margin-top:1rem">Jugar otra vez</button></div>`;say(score>=100?'¡Eres una calculadora humana de Python!':'Repasa // y % y vuelve a intentarlo.','wow');return}
    n++;cur=genDuel();
    box.innerHTML=`<div class="q"><span class="lbl">Ronda ${n}/10 · puntos ${score} · racha ${streak}</span><div class="bar"><div id="tb"></div></div><div class="bigq">${esc(cur.q)}</div><div class="opts">${cur.opts.map(o=>`<button class="mono">${o}</button>`).join('')}</div><div id="gfb"></div></div>`;
    const tb=$('#tb');tb.style.transition='none';tb.style.width='100%';void tb.offsetWidth;tb.style.transition='width 8s linear';tb.style.width='0%';
    const fin=(v)=>{clearTimeout(tm);const ok=v===cur.ans;
      $$('.opts button',box).forEach(b=>{b.disabled=true;if(b.textContent===cur.ans)b.classList.add('good');else if(b.textContent===v)b.classList.add('bad')});
      if(ok){streak++;S.maxStreak=Math.max(S.maxStreak||0,streak);score+=10+Math.min(streak,5)*2;say(pick(PRAISE),'happy')}else{streak=0;say(v===null?'Se acabó el tiempo.':`Era ${cur.ans}. Revisa la precedencia y el significado del operador.`,'sad')}
      GT=setTimeout(next,900)};
    $$('.opts button',box).forEach(b=>b.onclick=()=>fin(b.textContent));
    tm=setTimeout(()=>fin(null),8000);GT=tm;
  };next();
};
/* parsons */
const PARS=[
 {t:'Mayor de dos números',l:['n = 5','a = 7','if n > a:','    print("El mayor es", n)','else:','    print("El mayor es", a)']},
 {t:'Suma de 1 a 9',l:['suma = 0','for n in range(1, 10):','    suma = suma + n','print(suma)']},
 {t:'Pares de una lista',l:['lista = [2, 4, 5, 1]','for n in lista:','    if n % 2 == 0:','        print(n, "es par")']},
 {t:'Validar la edad (while)',l:['edad = int(input("Edad: "))','while edad < 0:','    print("Valor incorrecto")','    edad = int(input("Edad: "))','print("Su edad es", edad)']},
 {t:'Recorrer un diccionario',l:['ciudades = {"Madrid": 27.3, "Soria": 19.5}','for k, v in ciudades.items():','    if v > 20:','        print(k, v)']},
 {t:'Función con return',l:['def cuadrado(n):','    return n ** 2','resultado = cuadrado(4)','print(resultado)']}
];
G.parsons=()=>{
  let pi=-1;const box=$('#game');
  const load=()=>{
    pi=(pi+1)%PARS.length;const P=PARS[pi];let pool=shuffle(P.l.map((t,i)=>({t,i}))),ans=[];
    const draw=(msg)=>{
      box.innerHTML=`<div class="q"><span class="lbl">Puzzle ${pi+1}/${PARS.length}</span><div class="qt">${P.t}: haz clic en las líneas para colocarlas en orden.</div>
      <div class="pz"><div><span class="lbl">Disponibles</span><div id="pp">${pool.map((o,k)=>`<div class="ln" data-k="${k}">${esc(o.t)||' '}</div>`).join('')}</div></div>
      <div><span class="lbl">Tu programa (clic para quitar)</span><div class="zone" id="pa">${ans.map((o,k)=>`<div class="ln" data-a="${k}">${esc(o.t)}</div>`).join('')}</div></div></div>
      <div style="display:flex;gap:.5rem;margin-top:1rem"><button class="btn" id="pc" ${pool.length?'disabled':''}>Comprobar</button><button id="pn">Otro puzzle</button></div><div id="pf">${msg||''}</div></div>`;
      $$('[data-k]',box).forEach(e=>e.onclick=()=>{ans.push(pool.splice(+e.dataset.k,1)[0]);draw()});
      $$('[data-a]',box).forEach(e=>e.onclick=()=>{pool.push(ans.splice(+e.dataset.a,1)[0]);draw()});
      $('#pn').onclick=load;
      $('#pc').onclick=()=>{const ok=ans.every((o,k)=>o.t===P.l[k]);
        if(ok){say('¡Perfecto! La indentación define los bloques.','wow');addXP(15);draw(`<div class="fb g"><b>Correcto.</b> Resultado:</div>${code(P.l.join('\n'))}`)}
        else{say('Hay líneas mal colocadas. Piensa qué debe ocurrir primero.','sad');draw(`<div class="fb b">Todavía no. Pista: ${ans.findIndex((o,k)=>o.t!==P.l[k])+1}ª línea incorrecta.</div>`)}};
    };draw();
  };load();
};

 {t:'Suma de 1 a 10',l:['suma = 0','for n in range(1, 10):','    suma = suma + n','print(suma)'],b:1,w:'range(1, 10) llega hasta 9; para incluir el 10 hay que escribir range(1, 11).'},
 {t:'Suma de dos números',l:['n = input("Número 1: ")','x = input("Número 2: ")','print("la suma es", n + x)'],b:2,w:'input() devuelve texto: n + x concatena ("3"+"4"="34"). Hay que usar int(n) + int(x).'},
 {t:'Modificar una tupla',l:['mitupla = (4, 9, 3)','print(mitupla[0])','mitupla[1] = 20','print(mitupla)'],b:2,w:'Las tuplas son inmutables: asignar a mitupla[1] lanza TypeError.'},
 {t:'Temperatura en un diccionario',l:['ciudades = {"Madrid": 27.3, "Soria": 19.5}','print(ciudades["Madrid"])','print(ciudades["Toledo"])'],b:2,w:'La clave "Toledo" no existe: KeyError. Usa una clave existente o añade antes la pareja.'},

G.bug=()=>{
  let bi=-1;const box=$('#game');
  const load=()=>{bi=(bi+1)%BUGS.length;const B=BUGS[bi];
    box.innerHTML=`<div class="q"><span class="lbl">Caso ${bi+1}/${BUGS.length}</span><div class="qt">${B.t}: toca la línea con el error.</div><div class="tracecode" style="margin-top:.6rem">${B.l.map((t,k)=>`<button class="bugline" data-k="${k}">${hl(t)||' '}</button>`).join('')}</div><div id="bf"></div></div>`;
    $$('.bugline',box).forEach(b=>b.onclick=()=>{const k=+b.dataset.k,ok=k===B.b;
      $$('.bugline',box).forEach((x,i)=>{x.disabled=true;if(i===B.b)x.style.borderColor='var(--ok)';else if(i===k)x.style.borderColor='var(--ko)'});
      if(ok)addXP(10);say(ok?'¡Bug cazado!':'Ese no era. Lee el porqué.',ok?'wow':'sad');
      $('#bf').innerHTML=`<div class="fb ${ok?'g':'b'}"><b>${ok?'Correcto.':'No es esa línea.'}</b> ${esc(B.w)}</div><button class="btn" style="margin-top:.8rem" id="bn">Siguiente caso</button>`;$('#bn').onclick=load});
  };load();
};
